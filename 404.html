<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ARTCLUB</title>
<!--
  GitHub Pages は静的配信なので /admin のようなパスは 404 になる。
  そのとき、この 404 ページが index.html#admin に流し直す。
  こうしておくと、アドレスバーに /admin と打つだけで管理画面に入れる。

  何でもかんでも飛ばすと、ただの打ち間違いまで画面が開いてしまうので、
  受け付けるのは下の ROUTES に書いたものだけ。それ以外はトップに戻す。
-->
<script>
  (function () {
    var ROUTES = ['admin'];
    var path = location.pathname.replace(/\/+$/, '');
    var parts = path.split('/').filter(Boolean);
    var base = '/';
    // /work/{id} は Worker が本番で受ける。Pages 単体のときはハッシュへ落とす
    if (parts[0] === 'work' && parts[1]) {
      location.replace(base + '#work/' + encodeURIComponent(parts[1]));
      return;
    }
    var last = parts[parts.length - 1] || '';
    var hash = ROUTES.indexOf(last) >= 0 ? '#' + last : '';
    location.replace(base + hash);
  })();
</script>
</head>
<body></body>
</html>
