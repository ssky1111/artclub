<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ARTCLUB</title>
<!--
  GitHub Pages など、実ファイルのない /atelier や /log はここに来る。
  アドレスバーのパスはそのまま残し、トップの SPA を読み直してから
  同じパスへ戻す（History API 用）。

  /privacy/ /terms/ /work/ は実体がある（or Worker）ので通常ここには来ない。
-->
<script>
  (function () {
    var path = location.pathname + location.search + location.hash;
    try { sessionStorage.setItem('artclub.spaPath', path); } catch (e) {}
    var base = location.pathname.indexOf('/artclub') === 0 ? '/artclub/' : '/';
    location.replace(base);
  })();
</script>
</head>
<body></body>
</html>
